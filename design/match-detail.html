<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist — match detail</title>
<style>
  :root {
    --canvas: #f7f4ef;
    --surface: #ffffff;
    --border: #e8e2d8;
    --text-primary: #211d17;
    --text-secondary: #6b6455;
    --text-muted: #6b6455;
    --accent: #c07830;
    --accent-text: #a3651f;
    --accent-tint: #f5e8d8;
    --accent-tint-border: #e0bf8f;
    --track: #ece6d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .page { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  .back-link {
    display: inline-block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-decoration: none; margin-bottom: 20px;
  }
  .back-link:hover { color: var(--accent-text); }

  .card-header { display: flex; align-items: center; margin-bottom: 14px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent-tint); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
    margin-right: 12px; flex-shrink: 0;
  }
  .company-name { font-size: 15px; font-weight: 600; }
  .job-title { font-size: 22px; font-weight: 600; margin: 0 0 14px; }

  .qual-line {
    border-left: 3px solid var(--accent-tint-border); background: var(--accent-tint); border-radius: 0 8px 8px 0;
    padding: 12px 16px; font-size: 15px; line-height: 1.5; color: #4a3d29; margin: 0 0 20px;
  }

  .meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .chip {
    font-size: 12px; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px;
  }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .panel-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 14px;
  }

  .score-row { display: grid; grid-template-columns: 1fr auto 46px; align-items: center; gap: 12px; font-size: 13px; padding: 7px 0; }
  .score-row .bar-track { grid-column: 1 / span 3; height: 6px; background: var(--track); border-radius: 999px; margin-top: 4px; }
  .score-label { color: var(--text-primary); text-transform: capitalize; }
  .score-pct { text-align: right; font-weight: 600; }
  .bar-fill { height: 6px; border-radius: 999px; background: var(--accent); }

  .apply-link {
    display: inline-block; font-size: 14px; font-weight: 700; color: var(--accent-text);
    text-decoration: none; margin-top: 4px;
  }
  .apply-link:hover { text-decoration: underline; }

  .empty-state {
    font-size: 14px; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
  }
</style>
</head>
<body>

<main class="page">
  <a class="back-link" href="feed-prototype-v1.html">← Back to your matches</a>
  <div id="content">Loading…</div>
</main>

<script>
  var API_BASE = window.location.origin;
  var trackingId = new URLSearchParams(window.location.search).get('trackingId');

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function remoteChip(location) {
    if (location.remote_policy === 'remote') return 'Remote';
    var place = location.city && location.region ? location.city + ', ' + location.region : '';
    if (location.remote_policy === 'hybrid') return 'Hybrid' + (place ? ' — ' + place : '');
    return place || 'Onsite';
  }

  function salaryChip(salary) {
    if (!salary || salary.min == null) return null;
    var round = function (n) { return Math.round(n / 1000); };
    return '$' + round(salary.min) + '–' + round(salary.max) + 'k';
  }

  function buildScoreRow(sub) {
    return el('div', { class: 'score-row' }, [
      el('span', { class: 'score-label', text: sub.name.replace(/_/g, ' ') }),
      el('span', {}),
      el('span', { class: 'score-pct', text: sub.pct_of_max + '%' }),
      el('div', { class: 'bar-track' }, [el('div', { class: 'bar-fill', style: 'width:' + sub.pct_of_max + '%' })]),
    ]);
  }

  var content = document.getElementById('content');

  fetch(API_BASE + '/api/me', { credentials: 'include' })
    .then(function (res) {
      if (res.status === 401) { window.location.href = 'login.html'; return Promise.reject(new Error('redirecting')); }
      if (!res.ok) throw new Error('API returned ' + res.status);
      return res.json();
    })
    .then(function (client) {
      var app = client.applications.filter(function (a) { return a.trackingId === trackingId; })[0];
      if (!app) {
        content.innerHTML = '';
        content.appendChild(el('p', { class: 'empty-state', text: 'No match found for this link — it may belong to a different account, or the link is out of date.' }));
        return;
      }

      document.title = 'Shortlist — ' + app.jobTitleSnapshot;
      var posting = app.jobPosting.posting;
      var initial = app.companySnapshot.charAt(0).toUpperCase();
      var chips = [remoteChip(posting.location)];
      var salary = salaryChip(posting.salary);
      if (salary) chips.push(salary);

      content.innerHTML = '';
      content.appendChild(el('div', { class: 'card-header' }, [
        el('div', { class: 'avatar', 'aria-hidden': 'true', text: initial }),
        el('span', { class: 'company-name', text: app.companySnapshot }),
      ]));
      content.appendChild(el('h1', { class: 'job-title', text: app.jobTitleSnapshot }));
      content.appendChild(el('p', { class: 'qual-line', text: app.passReason || 'Matched against this role\'s requirements.' }));
      content.appendChild(el('div', { class: 'meta-chips' }, chips.map(function (c) { return el('span', { class: 'chip', text: c }); })));

      if (app.fullResult.sub_scores && app.fullResult.sub_scores.length) {
        var scorePanel = el('div', { class: 'panel' }, [el('p', { class: 'panel-label', text: 'Why this is a match' })]);
        app.fullResult.sub_scores.forEach(function (sub) { scorePanel.appendChild(buildScoreRow(sub)); });
        content.appendChild(scorePanel);
      }

      content.appendChild(el('div', { class: 'panel' }, [
        el('p', { class: 'panel-label', text: 'Application' }),
        el('p', { text: 'Status: ' + app.status.replace(/_/g, ' ') }),
        el('a', { class: 'apply-link', href: app.applyLinkSnapshot, target: '_blank', rel: 'noopener noreferrer', text: 'View the original posting →' }),
      ]));
    })
    .catch(function (err) {
      if (err.message === 'redirecting') return;
      content.innerHTML = '';
      content.appendChild(el('p', { class: 'empty-state', text: err.message }));
    });
</script>

</body>
</html>
