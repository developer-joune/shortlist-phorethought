<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist — sign in</title>
<style>
  :root {
    --canvas: #f7f4ef;
    --surface: #ffffff;
    --border: #e8e2d8;
    --text-primary: #211d17;
    --text-secondary: #6b6455;
    --accent: #c07830;
    --accent-text: #a3651f;
    --accent-tint: #f5e8d8;
    --fail: #b3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 380px; margin: 0 auto; padding: 96px 16px; }
  .greeting { font-size: 23px; font-weight: 600; margin: 0 0 8px; }
  .subtext { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; box-shadow: 0 1px 2px rgba(33, 29, 23, 0.04);
  }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--canvas); color: var(--text-primary);
  }
  button {
    width: 100%; font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 12px 20px;
    border: 1px solid var(--accent); background: var(--accent); color: #2b1c0c; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--fail); font-size: 13px; margin: 0 0 14px; display: none; }
  .error.visible { display: block; }
</style>
</head>
<body>

<main class="wrap">
  <h1 class="greeting">Sign in to Shortlist</h1>
  <p class="subtext">See your live matches, applications, and status.</p>
  <div class="card">
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>
</main>

<script>
  var API_BASE = 'http://localhost:3001';
  var form = document.getElementById('login-form');
  var errorEl = document.getElementById('error');
  var submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('visible');
    submitBtn.disabled = true;

    fetch(API_BASE + '/api/auth/client/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.body.error || 'Login failed.');
        window.location.href = 'feed-prototype-v1.html';
      })
      .catch(function (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
        submitBtn.disabled = false;
      });
  });
</script>

</body>
</html>
