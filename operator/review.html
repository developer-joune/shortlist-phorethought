<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist — client review</title>
<style>
  :root {
    --canvas: #f7f4ef;
    --surface: #ffffff;
    --border: #e8e2d8;
    --text-primary: #211d17;
    --text-secondary: #6b6455;
    --accent: #c07830;
    --accent-text: #a3651f;
    --accent-tint: #f5e8d8;
    --track: #ece6d8;
    --pass: #2f7d4f;
    --fail: #b3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 32px 20px 100px; }
  .back-link {
    display: inline-block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-decoration: none; margin-bottom: 20px;
  }
  .back-link:hover { color: var(--accent-text); }

  .header-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 4px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; }
  .band-chip {
    font-size: 13px; font-weight: 700; color: var(--accent-text); background: var(--accent-tint);
    border-radius: 999px; padding: 3px 12px; white-space: nowrap;
  }
  .header-meta { font-size: 13px; color: var(--text-secondary); margin: 0 0 32px; }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  .panel-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 12px;
  }

  .reason-panel {
    border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 0 14px 14px 0;
  }
  .reason-panel p { font-size: 15px; margin: 0; color: #4a3d29; }

  .score-row {
    display: grid; grid-template-columns: 1fr auto 46px; align-items: center; gap: 12px;
    font-size: 13px; padding: 7px 0;
  }
  .score-row .bar-track {
    grid-column: 1 / span 3; height: 6px; background: var(--track); border-radius: 999px; margin-top: 4px;
  }
  .score-label { color: var(--text-primary); }
  .score-raw { color: var(--text-secondary); text-align: right; }
  .score-pct { text-align: right; font-weight: 600; }
  .bar-fill { height: 6px; border-radius: 999px; background: var(--accent); }
  .score-total {
    display: flex; justify-content: space-between; font-size: 14px; font-weight: 700;
    padding-top: 12px; margin-top: 6px; border-top: 1px solid var(--border);
  }

  .gate-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px;
  }
  @media (max-width: 560px) { .gate-grid { grid-template-columns: 1fr; } }
  .gate-item { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .gate-check { color: var(--pass); font-weight: 700; }
  .gate-cross { color: var(--fail); font-weight: 700; }
  .gate-detail { display: block; color: var(--text-secondary); font-size: 12px; }

  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 620px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-grid dl { margin: 0; font-size: 13px; }
  .compare-grid dt { color: var(--text-secondary); margin-top: 10px; }
  .compare-grid dt:first-child { margin-top: 0; }
  .compare-grid dd { margin: 2px 0 0; font-weight: 500; }

  .decision-panel {
    border: 2px solid var(--border); margin-top: 14px;
  }
  .decision-panel textarea {
    width: 100%; min-height: 80px; font: inherit; font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; resize: vertical; margin-bottom: 14px;
    background: var(--canvas); color: var(--text-primary);
  }
  .decision-note {
    font-size: 12px; color: var(--text-secondary); margin: 0 0 14px;
  }
  .decision-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .decision-actions button {
    font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 11px 20px;
    border: 1px solid var(--border); cursor: pointer;
  }
  .decision-actions button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-promote { background: var(--accent); color: #2b1c0c; border-color: var(--accent); }
  .btn-reject { background: var(--surface); color: var(--text-primary); }

  .applications-block details {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 14px;
  }
  /* Borderline applications need an operator decision -- per subcon_ui's
     review, they must read as action items even collapsed, not just once
     expanded to the decision panel. */
  .applications-block details.needs-decision {
    border: 1px solid var(--accent); border-left: 4px solid var(--accent);
  }
  .applications-block summary {
    cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .applications-block summary .job-company { color: var(--text-secondary); font-weight: 400; }
  .applications-block details.needs-decision summary::after {
    content: 'Needs your decision'; font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--accent-text); background: var(--accent-tint);
    border-radius: 999px; padding: 3px 10px; margin-left: auto;
  }
  .applications-block .app-body { margin-top: 16px; }
  .skills-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .skills-list li {
    font-size: 12px; background: var(--accent-tint); color: var(--accent-text); border-radius: 999px;
    padding: 2px 10px;
  }
</style>
</head>
<body>

<main class="page">
  <a class="back-link" href="index.html">← Back to client list</a>
  <a class="back-link" href="#" id="sign-out-link" style="float:right;">Sign out</a>

  <div id="client-content">Loading…</div>
</main>

<script>
  // Same-origin, not a hardcoded host -- server.js serves this page and the
  // API from the same origin, and that origin changes (localhost in dev, the
  // Cloudflare tunnel's domain in the public-facing case). A hardcoded
  // localhost:3001 here would silently fail for every real visitor whose
  // browser has nothing listening on their own localhost:3001.
  var API_BASE = window.location.origin;
  var clientId = new URLSearchParams(window.location.search).get('clientId');
  var content = document.getElementById('client-content');

  document.getElementById('sign-out-link').addEventListener('click', function (e) {
    e.preventDefault();
    fetch(API_BASE + '/api/auth/operator/logout', { method: 'POST', credentials: 'include' })
      .then(function () { window.location.href = 'login.html'; });
  });

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function bandLabel(band) {
    if (!band) return 'Not scored';
    return band.charAt(0).toUpperCase() + band.slice(1);
  }

  function money(amount, currency) {
    if (amount == null) return null;
    return '$' + amount.toLocaleString() + (currency && currency !== 'USD' ? ' ' + currency : '');
  }

  function buildScoreRow(sub) {
    var pct = sub.pct_of_max;
    var row = el('div', { class: 'score-row' }, [
      el('span', { class: 'score-label', text: sub.name.replace(/_/g, ' ') }),
      el('span', { class: 'score-raw', text: sub.score + '/' + sub.weight }),
      el('span', { class: 'score-pct', text: pct + '%' }),
      el('div', { class: 'bar-track' }, [
        el('div', { class: 'bar-fill', style: 'width:' + pct + '%' }),
      ]),
    ]);
    return row;
  }

  function buildGateItem(gate) {
    var passed = gate.passed;
    var icon = el('span', { class: passed ? 'gate-check' : 'gate-cross', text: passed ? '✓' : '✗' });
    var label = document.createTextNode(' ' + gate.gate_name.replace(/_/g, ' '));
    var children = [icon, label];
    if (!passed && gate.detail) {
      children.push(el('span', { class: 'gate-detail', text: gate.detail }));
    }
    return el('div', { class: 'gate-item' }, children);
  }

  function buildDecisionPanel(trackingId) {
    var idSuffix = trackingId.replace(/[^a-zA-Z0-9]/g, '-');
    var reasonId = 'reason-' + idSuffix;
    var promoteId = 'promote-' + idSuffix;
    var rejectId = 'reject-' + idSuffix;

    var panel = el('div', { class: 'panel decision-panel' }, [
      el('p', { class: 'panel-label', text: 'Decision' }),
      el('textarea', {
        id: reasonId,
        placeholder: 'Required — why you\'re promoting or rejecting this one. Logged either way.',
        'aria-label': 'Decision reason (required)',
      }),
      el('p', { class: 'decision-note', text: 'Exactly two outcomes — no snooze/defer. A reason is required for either one. Not yet wired to a write endpoint (server.js currently only exposes read-only GET routes) — decision buttons are shown for reference but do not submit anywhere yet.' }),
      el('div', { class: 'decision-actions' }, [
        el('button', { type: 'button', class: 'btn-promote', id: promoteId, disabled: 'disabled', text: 'Promote to Qualified' }),
        el('button', { type: 'button', class: 'btn-reject', id: rejectId, disabled: 'disabled', text: 'Confirm Reject' }),
      ]),
    ]);

    setTimeout(function () {
      var reasonField = document.getElementById(reasonId);
      var promoteBtn = document.getElementById(promoteId);
      var rejectBtn = document.getElementById(rejectId);
      reasonField.addEventListener('input', function () {
        var hasReason = reasonField.value.trim().length > 0;
        promoteBtn.disabled = !hasReason;
        rejectBtn.disabled = !hasReason;
      });
    }, 0);

    return panel;
  }

  // Per subcon_ui's review of 9f49565: the per-application view had score
  // bars/gates with nothing to compare them against -- this restores the
  // original wireframe's side-by-side job-requirements-vs-client-profile
  // intent, scoped to this one application's job posting.
  function buildCompareGrid(app, clientProfile) {
    var posting = app.jobPosting.posting;
    var req = posting.requirements || {};
    var mustHave = req.must_have_skills || [];
    var niceToHave = posting.nice_to_have_skills || [];
    var skillById = {};
    (clientProfile.skills || []).forEach(function (s) { skillById[s.skill_id] = s; });

    var matchedText = mustHave.length
      ? mustHave.map(function (s) {
          var owned = skillById[s.skill_id];
          return s.display_name + (owned ? ' — ' + owned.years_experience + ' yrs ✓' : ' — not on file ✗');
        }).join(' · ')
      : 'No must-have skills listed';

    var salary = posting.salary;
    var salaryText = salary ? '$' + salary.min.toLocaleString() + '–' + salary.max.toLocaleString() + '/' + salary.period : 'Not listed';
    var floor = clientProfile.basics.salary_floor;
    var floorText = floor ? '$' + floor.min.toLocaleString() + '/' + floor.period : 'Not set';

    var exclusions = clientProfile.exclusions || {};

    return el('div', { class: 'panel' }, [
      el('p', { class: 'panel-label', text: 'Job posting & client profile — side by side' }),
      el('div', { class: 'compare-grid' }, [
        el('dl', {}, [
          el('dt', { text: 'Required skills' }),
          el('dd', { text: mustHave.length ? mustHave.map(function (s) { return s.display_name + (s.min_years ? ' (' + s.min_years + '+ yrs)' : ''); }).join(', ') : 'None listed' }),
          el('dt', { text: 'Nice-to-have' }),
          el('dd', { text: niceToHave.length ? niceToHave.map(function (s) { return s.display_name; }).join(', ') : 'None listed' }),
          el('dt', { text: 'Salary range' }),
          el('dd', { text: salaryText }),
          el('dt', { text: 'Screening questions' }),
          el('dd', { text: (posting.screening_questions || []).length + ' listed' }),
        ]),
        el('dl', {}, [
          el('dt', { text: 'Matched skills' }),
          el('dd', { text: matchedText }),
          el('dt', { text: 'Seniority' }),
          el('dd', { text: (posting.seniority_level || 'not listed') + ' posting vs ' + (clientProfile.qualification_bar.target_seniority || 'not set') + ' target' }),
          el('dt', { text: 'Salary floor' }),
          el('dd', { text: floorText }),
          el('dt', { text: 'Remote preference / exclusions' }),
          el('dd', { text: (exclusions.required_remote_policy || 'no preference').replace(/_/g, ' ') + ' · ' + ((exclusions.excluded_industries || []).length ? exclusions.excluded_industries.join(', ') + ' excluded' : 'none triggered') }),
        ]),
      ]),
    ]);
  }

  function buildApplication(app, clientProfile) {
    var result = app.fullResult;
    var scoreText = app.totalScore != null ? app.totalScore + '/100' : 'Not scored';
    var summary = el('summary', {}, [
      document.createTextNode(app.jobTitleSnapshot + ' '),
      el('span', { class: 'job-company', text: '— ' + app.companySnapshot }),
      el('span', { class: 'band-chip', text: bandLabel(app.band) + ' · ' + scoreText }),
    ]);

    var body = el('div', { class: 'app-body' });

    var reasonText = app.passReason || app.rejectReason;
    if (reasonText) {
      body.appendChild(el('div', { class: 'panel reason-panel' }, [
        el('p', { class: 'panel-label', text: app.band === 'reject' ? 'Why this was rejected' : 'Why this scored the way it did' }),
        el('p', { text: reasonText }),
      ]));
    }

    if (result.sub_scores && result.sub_scores.length) {
      var scorePanel = el('div', { class: 'panel' }, [
        el('p', { class: 'panel-label', text: 'Full score breakdown' }),
      ]);
      result.sub_scores.forEach(function (sub) { scorePanel.appendChild(buildScoreRow(sub)); });
      scorePanel.appendChild(el('div', { class: 'score-total' }, [
        el('span', { text: 'Total' }),
        el('span', { text: app.totalScore + '/100' }),
      ]));
      body.appendChild(scorePanel);
    }

    if (result.hard_gates && result.hard_gates.length) {
      var allPassed = result.hard_gates.every(function (g) { return g.passed; });
      var gatePanel = el('div', { class: 'panel' }, [
        el('p', { class: 'panel-label', text: 'Hard gates — ' + (allPassed ? 'all passed' : 'one or more failed') }),
      ]);
      var gateGrid = el('div', { class: 'gate-grid' });
      result.hard_gates.forEach(function (gate) { gateGrid.appendChild(buildGateItem(gate)); });
      gatePanel.appendChild(gateGrid);
      body.appendChild(gatePanel);
    }

    body.appendChild(buildCompareGrid(app, clientProfile));

    if (app.band === 'borderline') {
      body.appendChild(buildDecisionPanel(app.trackingId));
    }

    var details = el('details', { class: app.band === 'borderline' ? 'needs-decision' : '' }, [summary, body]);
    return details;
  }

  fetch(API_BASE + '/api/clients/' + encodeURIComponent(clientId), { credentials: 'include' })
    .then(function (res) {
      if (res.status === 401) { window.location.href = 'login.html'; return Promise.reject(new Error('redirecting')); }
      if (!res.ok) throw new Error(res.status === 404 ? 'No client found for clientId "' + clientId + '"' : 'API returned ' + res.status);
      return res.json();
    })
    .then(function (client) {
      document.title = 'Shortlist — review: ' + client.name;
      content.innerHTML = '';

      content.appendChild(el('div', { class: 'header-row' }, [
        el('h1', { text: client.name }),
        el('span', { class: 'band-chip', text: client.status || 'unknown status' }),
      ]));
      content.appendChild(el('p', { class: 'header-meta', text: client.email + ' · client ID: ' + client.clientId }));

      var basics = client.profile.basics;
      var qualBar = client.profile.qualification_bar;
      var exclusions = client.profile.exclusions;

      var profilePanel = el('div', { class: 'panel' }, [
        el('p', { class: 'panel-label', text: 'Profile on file' }),
        el('div', { class: 'compare-grid' }, [
          el('dl', {}, [
            el('dt', { text: 'Target titles' }),
            el('dd', { text: basics.target_job_titles.join(', ') }),
            el('dt', { text: 'Location' }),
            el('dd', { text: basics.location.city + ', ' + basics.location.region }),
            el('dt', { text: 'Salary floor' }),
            el('dd', { text: money(basics.salary_floor.min, basics.salary_floor.currency) + '/' + basics.salary_floor.period }),
            el('dt', { text: 'Work authorization' }),
            el('dd', { text: basics.work_authorization.status + (basics.work_authorization.sponsorship_needed ? ' (needs sponsorship)' : ', no sponsorship needed') }),
          ]),
          el('dl', {}, [
            el('dt', { text: 'Target seniority' }),
            el('dd', { text: qualBar.target_seniority }),
            el('dt', { text: 'Notice period' }),
            el('dd', { text: basics.notice_period_days + ' days' }),
            el('dt', { text: 'Skills on file' }),
            el('dd', {}, [
              (function () {
                var list = el('ul', { class: 'skills-list' });
                client.profile.skills.forEach(function (s) {
                  list.appendChild(el('li', { text: s.display_name + ' · ' + s.years_experience + 'y' }));
                });
                return list;
              })(),
            ]),
          ]),
        ]),
      ]);
      content.appendChild(profilePanel);

      var prefsPanel = el('div', { class: 'panel' }, [
        el('p', { class: 'panel-label', text: 'Preferences & exclusions' }),
        el('div', { class: 'compare-grid' }, [
          el('dl', {}, [
            el('dt', { text: 'Remote preference' }),
            el('dd', { text: exclusions.required_remote_policy.replace(/_/g, ' ') }),
            el('dt', { text: 'Target locations' }),
            el('dd', { text: basics.target_locations.map(function (l) { return l.city ? l.city + ', ' + l.region : 'remote'; }).join(' · ') }),
          ]),
          el('dl', {}, [
            el('dt', { text: 'Excluded industries' }),
            el('dd', { text: exclusions.excluded_industries.length ? exclusions.excluded_industries.join(', ') : 'none' }),
            el('dt', { text: 'Dealbreakers' }),
            el('dd', { text: exclusions.dealbreakers.length ? exclusions.dealbreakers.map(function (d) { return d.detail; }).join('; ') : 'none' }),
          ]),
        ]),
      ]);
      content.appendChild(prefsPanel);

      var appsBlock = el('div', { class: 'applications-block' }, [
        el('p', { class: 'panel-label', text: 'Applications (' + client.applications.length + ')' }),
      ]);
      if (client.applications.length === 0) {
        appsBlock.appendChild(el('p', { text: 'No applications on file for this client yet.' }));
      } else {
        client.applications.forEach(function (app) { appsBlock.appendChild(buildApplication(app, client.profile)); });
      }
      content.appendChild(appsBlock);
    })
    .catch(function (err) {
      content.innerHTML = '';
      content.appendChild(el('div', { class: 'panel reason-panel' }, [
        el('p', { class: 'panel-label', text: 'Failed to load client' }),
        el('p', { text: err.message + (clientId ? '' : ' (no ?clientId= given in the URL)') }),
      ]));
    });
</script>

</body>
</html>
