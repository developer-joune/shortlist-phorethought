<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist — operator login</title>
<style>
  :root {
    --canvas: #f7f4ef;
    --surface: #ffffff;
    --border: #e8e2d8;
    --text-primary: #211d17;
    --text-secondary: #6b6455;
    --accent: #c07830;
    --accent-text: #a3651f;
    --accent-tint: #f5e8d8;
    --fail: #b3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 360px; margin: 0 auto; padding: 80px 20px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 6px;
  }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 24px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px;
  }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 0 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); color: var(--text-primary);
  }
  button {
    width: 100%; font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 11px 20px;
    border: 1px solid var(--accent); background: var(--accent); color: #2b1c0c; cursor: pointer;
  }
  button:disabled, button[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--fail); font-size: 13px; margin: 0 0 14px; display: none; }
  .error.visible { display: block; }
</style>
</head>
<body>

<main class="page">
  <p class="eyebrow">Operator</p>
  <h1>Sign in</h1>
  <div class="panel">
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>
</main>

<script>
  var API_BASE = 'http://localhost:3001';
  var form = document.getElementById('login-form');
  var errorEl = document.getElementById('error');
  var submitBtn = document.getElementById('submit-btn');
  var submitting = false;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitting) return;
    submitting = true;
    errorEl.classList.remove('visible');
    // aria-disabled, not disabled -- a disabled control can't hold focus,
    // which would strand focus at <body> since this fires while the
    // button is still focused (per subcon_a11y's review). The submitting
    // flag above does the actual re-entry guarding aria-disabled can't.
    submitBtn.setAttribute('aria-disabled', 'true');
    submitBtn.textContent = 'Signing in…';

    fetch(API_BASE + '/api/auth/operator/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.body.error || 'Login failed.');
        window.location.href = 'index.html';
      })
      .catch(function (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
        submitting = false;
        submitBtn.removeAttribute('aria-disabled');
        submitBtn.textContent = 'Sign in';
        submitBtn.focus();
      });
  });
</script>

</body>
</html>
